spring.datasource.url=jdbc:sqlite:midas-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=true

# Prevent DesktopLifecycleService from calling System.exit() during tests
midas.desktop.auto-shutdown-enabled=false
midas.desktop.launch-browser=false

midas.cleanup.enabled=false

midas.sqlite.optimize.enabled=false