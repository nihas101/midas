spring.application.name=midas
server.port=8082

server.error.include-message=never
server.error.include-stacktrace=never

# https://docs.spring.io/spring-framework/reference/core/aot.html#aot.introduction
spring.aot.enabled=true
spring.main.lazy-initialization=true
spring.jmx.enabled=false
management.endpoints.enabled-by-default=false
server.error.whitelabel.enabled=false

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=false

spring.datasource.url=jdbc:sqlite:midas.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Midas Defaults
midas.title=Midas
midas.i18n.default-language=en
midas.cleanup.enabled=true

# SQLite
midas.db.sqlite.optimize.enabled=true

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.file.name=logs/midas.log